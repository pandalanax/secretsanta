<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Wichteln</title>

  <script src="vendors/Lodash-3.10.1.js"></script>
  <script src="vendors/Cryptojs.aes-3.1.2.js"></script>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    .main {
      margin: 0;

      width: 100%;
      height: 100%;

      padding: 0;
    }

    body {
      background: url(./assets/snow.png), url(./assets/santa.png),
        url(./assets/snow.png), radial-gradient(#fb3b3b, #ef3d3d);
      background-repeat: repeat, no-repeat, repeat, no-repeat;

      animation-name: snow;
      animation-duration: 5s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;

      font-family: "Comic Sans MS";
    }

    @keyframes snow {
      from {
        background-position:
          130px 40px,
          bottom right,
          0 0,
          0 0;
      }

      to {
        background-position:
          130px 640px,
          bottom right,
          0 300px,
          0 0;
      }
    }

    .spirit-of-christmas {
      display: block;

      position: absolute;
      bottom: 0;
      left: 0;

      padding: 20px;

      font-size: 10px;
      text-decoration: none;

      color: #ffffff;
    }

    .main {
      display: flex;
    }

    .background {
      position: absolute;

      left: 0;
      bottom: 0;
    }

    .wrapper {
      margin: auto;
      padding: 20px;

      background: repeating-linear-gradient(45deg,
          #5cc48a,
          #5cc48a 30px,
          #ffffff 30px,
          #ffffff 60px,
          #ef3d3d 60px,
          #ef3d3d 90px,
          #ffffff 90px,
          #ffffff 120px);

      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
    }

    .content {
      padding: 40px;

      background: #ffffff;

      text-align: center;
    }

    .title {
      font-size: 30px;
    }

    #pairing-name {
      font-size: 90px;
    }

    #pairing-details {
      margin-bottom: 20px;

      font-size: 20px;
    }

    .affiliate {
      display: block;
      box-sizing: content-box;

      margin-top: 40px;

      border: none;

      background: rgba(255, 255, 255, 0.7);
    }

    .affiliate+.affiliate {
      margin-top: 40px;
    }

    .blurred {
      filter: blur(25px);
      /* Adjust the blur strength here (higher value = more blur) */
      transition: filter 0.3s ease;
      /* Optional: adds a smooth transition when un-blurring */
    }
  </style>
  <script>
    // This function checks if the current time is after the fixed reveal time
    const revealDate = new Date("2025-10-19T19:00:00");

    const dayMonth = revealDate.toLocaleDateString("de-DE", {
      day: "2-digit",
      month: "2-digit",
    });

    // Get the time in the format "HH:MM"
    const time = revealDate.toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false, // 24-hour format
    });
    function canRevealPicks(revealDate) {
      const currentDate = new Date();
      return currentDate >= revealDate; // Return true if it's after the fixed time, false otherwise
    }

    // Decrypt and parse the query parameters
    var queryString = _.chain(location.search.slice(1).split(/&/g))
      .map(function (item) {
        if (item)
          return item.split(/=/).map(function (str) {
            return decodeURIComponent(str);
          });
      })
      .compact()
      .object()
      .value();

    var name = queryString.name;

    var pairing = CryptoJS.AES.decrypt(
      queryString.pairing,
      queryString.key,
    ).toString(CryptoJS.enc.Utf8);
    var pairingDefinition = pairing.match(/^([^(]+)(?: (\([^)]+\)))?$/);

    // When the page loads, check if the picks can be revealed or not
    document.addEventListener("DOMContentLoaded", function () {
      const nameElement = document.getElementById("name");
      const pairingNameElement = document.getElementById("pairing-name");
      const pairingDetailsElement =
        document.getElementById("pairing-details");

      // Set the name (it is always visible)
      nameElement.innerText = name;

      // If the reveal time has not passed, blur the pairing name
      // Show the pairing details
      if (canRevealPicks(revealDate)) {
        // If the reveal time has passed, remove the blur from the pairing name
        pairingNameElement.classList.remove("blurred");
        pairingNameElement.innerText = pairingDefinition[1];
        if (pairingDefinition[2]) {
          pairingDetailsElement.innerText = pairingDefinition[2];
        } else {
          pairingDetailsElement.style.display = "none";
        }
      } else {
        // If the reveal time has not passed, apply the blur to the pairing name
        pairingNameElement.classList.add("blurred");

        // Don't display pairing name or details yet
        pairingNameElement.innerText = "wichtel"; // Clear the pairing name
        const formattedDate = `Auflösung am ${dayMonth} um ${time} Uhr`;

        pairingDetailsElement.innerText = formattedDate;
      }
    });
  </script>
</head>

<body>
  <div class="main">
    <div class="wrapper">
      <div class="content">
        <!-- <audio autoplay loop id="christmas-music" preload="auto"> -->
        <!--   <source src="assets/alliwantforchristmas.mp3" type="audio/mpeg" /> -->
        <!--   Your browser does not support the audio element. -->
        <!-- </audio> -->
        <div class="title">
          Hi <span id="name"></span>! Du hast dieses Jahr
        </div>

        <div class="pairing">
          <div id="pairing-name"></div>
          <div id="pairing-details"></div>
        </div>

        <div class="title">gezogen!</div>
      </div>
    </div>

    <a href="https://ida-idefix.de" class="spirit-of-christmas">
      Want to start your own Secret Santa with your friends? Click here to get
      started!
    </a>
  </div>
</body>

</html>
